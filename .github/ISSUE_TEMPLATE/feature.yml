name: Feature request
description: Suggest a capability the packages do not have
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do that is hard or impossible today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you want
      description: >
        The API, prop or endpoint as you would like to use it. Code beats prose.
      render: typescript
    validations:
      required: true

  - type: dropdown
    id: surface
    attributes:
      label: Where it belongs
      options:
        - Widget
        - Server
        - Core
        - A new tracker adapter
        - Not sure
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: What you tried instead
      description: Workarounds you are using now, and why they are not enough.
